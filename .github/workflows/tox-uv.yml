name: tox-uv

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      env:
        required: true
        type: string
      uv-version:
        required: true
        type: string
      tox-version:
        required: true
        type: string
      tox-uv-version:
        required: true
        type: string

permissions: {}

jobs:
  tox:
    name: ${{ inputs.os }} / ${{ matrix.env }}
    runs-on: ${{ inputs.os }}
    env:
      # uv cache and checkout are on different drives on Windows, so hardlinks fail
      UV_LINK_MODE: copy
    strategy:
      matrix:
        env: ${{ fromJSON(inputs.env) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        version: ${{ inputs.uv-version }}
    - run: uv tool install "tox==$TOX_VERSION" --with "tox-uv==$TOX_UV_VERSION"
      shell: bash
      env:
        TOX_VERSION: ${{ inputs.tox-version }}
        TOX_UV_VERSION: ${{ inputs.tox-uv-version }}
    - run: tox -e "$MATRIX_ENV"
      shell: bash
      env:
        MATRIX_ENV: ${{ matrix.env }}
